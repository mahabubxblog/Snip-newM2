<!doctype html>
<html lang="bn" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SnipTok - Vertical Shorts & Reels</title>
    <meta name="description" content="Ultra-smooth TikTok and Instagram Reels style vertical video player with offline IndexedDB caching, Dropbox streaming conversion, and free static hosting with GitHub sync." />
    
    <!-- OpenGraph / Social Meta -->
    <meta property="og:title" content="SnipTok - Vertical Shorts & Reels" />
    <meta property="og:description" content="Ultra-smooth TikTok and Instagram Reels style vertical video player with offline IndexedDB caching, Dropbox streaming conversion, and free static hosting with GitHub sync." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./icon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SnipTok - Vertical Shorts & Reels" />
    <meta name="twitter:description" content="Ultra-smooth TikTok & Reels player with offline caching." />

    <!-- Mobile & PWA tags -->
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SnipTok" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Google Fonts for Bengali & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-rose-500 selection:text-white overscroll-none select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker if supported
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
