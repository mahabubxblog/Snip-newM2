<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background with squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(244,63,94,0.3)" stroke-width="8"/>
  
  <!-- Subtle back offset for 3D chromatic aberration effect -->
  <path d="M 280 130 C 305 130, 335 145, 360 170 C 350 172, 340 176, 330 185 C 315 170, 295 160, 275 160 L 275 300 C 275 345, 235 375, 195 375 C 150 375, 120 340, 120 300 C 120 255, 155 225, 200 225 C 215 225, 228 230, 240 238 L 240 130 Z" 
        fill="url(#neonCyan)" opacity="0.8" transform="translate(-8, -4)" />
        
  <!-- Main Rose Brand Shape -->
  <path d="M 290 120 C 315 120, 345 135, 370 160 C 360 162, 350 166, 340 175 C 325 160, 305 150, 285 150 L 285 290 C 285 335, 245 365, 205 365 C 160 365, 130 330, 130 290 C 130 245, 165 215, 210 215 C 225 215, 238 220, 250 228 L 250 120 Z" 
        fill="url(#neonPink)" filter="url(#glow)" />
        
  <!-- Play triangle overlay -->
  <polygon points="325,275 390,315 325,355" fill="#ffffff" filter="url(#glow)"/>
</svg>
